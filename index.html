<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Diet Planner</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>🥗 Smart Diet Planner</h1>
            <p>Track your calories and generate healthy diet plans</p>
        </div>

        <form id="dietForm">

            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>
            </div>

            <div class="grid">

                <div class="input-group">
                    <label>Age</label>
                    <input type="number" id="age" placeholder="Enter age" required>
                </div>

                <div class="input-group">
                    <label>Gender</label>
                    <select id="gender">
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>

            </div>

            <div class="grid">

                <div class="input-group">
                    <label>Weight (kg)</label>
                    <input type="number" id="weight" placeholder="Enter weight" required>
                </div>

                <div class="input-group">
                    <label>Height (cm)</label>
                    <input type="number" id="height" placeholder="Enter height" required>
                </div>

            </div>

            <div class="input-group">
                <label>Activity Level</label>

                <select id="activity">
                    <option value="1.2">Sedentary</option>
                    <option value="1.375">Lightly Active</option>
                    <option value="1.55">Moderately Active</option>
                    <option value="1.725">Very Active</option>
                </select>
            </div>

            <button type="submit">
                Generate Diet Plan 🚀
            </button>

        </form>

        <div class="result" id="resultBox">

            <div class="card">
                <h2>BMR 🔥</h2>
                <p id="bmr"></p>
            </div>

            <div class="card">
                <h2>TDEE ⚡</h2>
                <p id="tdee"></p>
            </div>

            <div class="card">
                <h2>Diet Suggestion 🥗</h2>
                <p id="diet"></p>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
